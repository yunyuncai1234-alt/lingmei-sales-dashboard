<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翎美2026年电商销售一览表</title><style>
:root{--blue:#073b78;--red:#e60012;--line:#dce5ef;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#17365d}.head{background:linear-gradient(135deg,#052f66,#0b5aa6);color:#fff;padding:25px 4vw}.head h1{margin:0;font-size:26px}.wrap{padding:18px 4vw 40px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;padding:16px;box-shadow:0 3px 14px #17365d0d}.panel h2{margin:0 0 13px;font-size:17px;border-left:5px solid var(--red);padding-left:9px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:10px;padding:16px;background:linear-gradient(180deg,#fff,#f7fbff)}.card .label{font-size:13px;color:#667a91}.card .value{font-size:26px;font-weight:700;color:var(--red);margin-top:8px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{border:1px solid var(--line);padding:9px;text-align:center}th{background:#eaf2fb;color:#124a84}.empty{text-align:center;padding:50px;color:#7b8da3}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.head h1{font-size:20px}.wrap{padding:10px}.panel{padding:11px}.card .value{font-size:20px}}
</style></head><body><header class="head"><h1 id="pageTitle">翎美2026年电商销售一览表</h1></header><main class="wrap" id="app"><div class="empty">正在读取最新数据…</div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient(LINGMEI_CONFIG.url,LINGMEI_CONFIG.key),app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(list){app.innerHTML='';list.forEach(s=>{let p=document.createElement('section');p.className='panel';let body='';if(s.display_type==='cards'){body='<div class="cards">'+(s.rows||[]).map(r=>'<div class="card"><div class="label">'+esc(r[0])+'</div><div class="value">'+esc(r[1])+'</div></div>').join('')+'</div>'}else{body='<div class="scroll"><table><thead><tr>'+(s.columns||[]).map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+(s.rows||[]).map(r=>'<tr>'+(s.columns||[]).map((_,i)=>'<td>'+esc(r[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}p.innerHTML='<h2>'+esc(s.title)+'</h2>'+body;app.appendChild(p)});if(!list.length)app.innerHTML='<div class="empty">暂时没有数据</div>'}
async function load(){let{data,error}=await db.from('dashboard_sections').select('*').order('sort_order');if(error){app.innerHTML='<div class="empty">数据读取失败：'+esc(error.message)+'</div>';return}render(data)}load();db.channel('dashboard-live').on('postgres_changes',{event:'*',schema:'public',table:'dashboard_sections'},load).subscribe();setInterval(load,60000);
</script></body></html>
