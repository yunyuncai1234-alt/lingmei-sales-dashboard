<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翎美数据后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font:14px Arial;color:#17365d}.top{background:#073b78;color:#fff;padding:16px 24px;display:flex;justify-content:space-between}.wrap{padding:18px 24px}.box{background:#fff;border:1px solid #d7e2ee;border-radius:12px;padding:16px;margin-bottom:14px}.login{max-width:430px;margin:60px auto}input,select,button{padding:9px;border:1px solid #bdcad8;border-radius:6px}input{width:100%;margin:6px 0}button{background:#0b62b5;color:#fff;border:0;cursor:pointer;margin:5px}.danger{background:#b3261e}.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bar select{min-width:220px}.gridwrap{overflow:auto;margin-top:12px}table{border-collapse:collapse;background:#fff;min-width:800px}th,td{border:1px solid #cbd8e8;padding:8px;min-width:130px;height:34px}th{background:#eaf2fb}th[contenteditable],td[contenteditable]{outline:none}th:focus,td:focus{box-shadow:inset 0 0 0 2px #2382d7;background:#fffdf0}.hint{color:#6f8195}.hidden{display:none}.msg{color:#17834b;margin-left:8px}</style></head><body>
<header class="top"><strong>翎美数据后台（仅管理员）</strong><button id="logout" class="hidden">退出登录</button></header><main class="wrap"><section id="login" class="box login"><h2>管理员登录</h2><input id="email" type="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><button id="signIn">登录</button><button id="signUp">首次使用：创建账号</button><p class="hint">第一次使用先创建账号；完成后请在 Supabase 关闭新用户注册。</p><div id="loginMsg"></div></section>
<section id="editor" class="hidden"><div class="box"><div class="bar"><select id="section"></select><button id="addSection">新增板块</button><button id="addRow">新增行</button><button id="addCol">新增列</button><button id="delRow" class="danger">删除最后一行</button><button id="delCol" class="danger">删除最后一列</button><button id="save">保存并同步BI</button><span id="msg" class="msg"></span></div><p class="hint">可直接从 Excel 复制整块表格，然后点击左上角单元格按 Ctrl+V。标题和表头都可直接修改。</p><label>板块标题：<input id="title"></label><div class="gridwrap" id="grid"></div></div></section></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient(LINGMEI_CONFIG.url,LINGMEI_CONFIG.key);let sections=[],current=null;const $=id=>document.getElementById(id);
function show(auth){$('login').classList.toggle('hidden',auth);$('editor').classList.toggle('hidden',!auth);$('logout').classList.toggle('hidden',!auth);if(auth)load()}
db.auth.getSession().then(({data})=>show(!!data.session));$('signIn').onclick=async()=>{let{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'登录成功';if(!error)show(true)};$('signUp').onclick=async()=>{let{error}=await db.auth.signUp({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'账号已创建，请检查邮箱或直接登录'};$('logout').onclick=async()=>{await db.auth.signOut();show(false)};
async function load(){let{data,error}=await db.from('dashboard_sections').select('*').order('sort_order');if(error){$('msg').textContent=error.message;return}sections=data;$('section').innerHTML=data.map(x=>'<option value="'+x.id+'">'+x.title+'</option>').join('');if(data.length){current=data[0];draw()}}
function draw(){if(!current)return;$('title').value=current.title;let t=document.createElement('table'),tr=document.createElement('tr');current.columns.forEach(x=>{let th=document.createElement('th');th.contentEditable=true;th.textContent=x;tr.appendChild(th)});t.appendChild(tr);current.rows.forEach(r=>{let tr=document.createElement('tr');current.columns.forEach((_,i)=>{let td=document.createElement('td');td.contentEditable=true;td.textContent=r[i]??'';tr.appendChild(td)});t.appendChild(tr)});$('grid').innerHTML='';$('grid').appendChild(t)}
$('section').onchange=()=>{current=sections.find(x=>String(x.id)==$('section').value);draw()};$('addRow').onclick=()=>{current.rows.push(current.columns.map(()=>''));draw()};$('addCol').onclick=()=>{current.columns.push('新列');current.rows.forEach(r=>r.push(''));draw()};$('delRow').onclick=()=>{current.rows.pop();draw()};$('delCol').onclick=()=>{current.columns.pop();current.rows.forEach(r=>r.pop());draw()};
$('grid').addEventListener('paste',e=>{let cell=e.target;if(!/^(TD|TH)$/.test(cell.tagName))return;e.preventDefault();let lines=e.clipboardData.getData('text').replace(/\r/g,'').split('\n').filter((x,i,a)=>x||i<a.length-1).map(x=>x.split('\t')),table=cell.closest('table'),r0=cell.parentElement.rowIndex,c0=cell.cellIndex;lines.forEach((r,ri)=>r.forEach((v,ci)=>{let rr=r0+ri,cc=c0+ci;while(table.rows.length<=rr){let tr=table.insertRow();for(let j=0;j<table.rows[0].cells.length;j++){let td=tr.insertCell();td.contentEditable=true}}while(table.rows[0].cells.length<=cc){for(let j=0;j<table.rows.length;j++){let c=j===0?document.createElement('th'):document.createElement('td');c.contentEditable=true;table.rows[j].appendChild(c)}}table.rows[rr].cells[cc].textContent=v}))});
function readGrid(){let rows=[...$('grid').querySelectorAll('tr')].map(tr=>[...tr.cells].map(c=>c.textContent.trim()));return{columns:rows.shift()||[],rows}}
$('save').onclick=async()=>{let g=readGrid(),payload={title:$('title').value.trim(),columns:g.columns,rows:g.rows,updated_at:new Date().toISOString()};let{error}=await db.from('dashboard_sections').update(payload).eq('id',current.id);$('msg').textContent=error?error.message:'已保存，BI已同步';if(!error){Object.assign(current,payload);setTimeout(()=>$('msg').textContent='',3000)}};
$('addSection').onclick=async()=>{let name=prompt('请输入新板块名称');if(!name)return;let key='custom_'+Date.now();let{error}=await db.from('dashboard_sections').insert({section_key:key,title:name,display_type:'table',columns:['表头1','表头2'],rows:[],sort_order:sections.length*10+100});if(error)$('msg').textContent=error.message;else load()};
</script></body></html>
